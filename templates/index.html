<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SwiftSale</title>

  <!-- Stripe (only works on Render/cloud; local create-checkout-session is disabled) -->
  <script src="https://js.stripe.com/v3/"></script>
  <script>
    const stripe = Stripe('{{ stripe_publishable_key|default("") }}');

    function initiateCheckout(tier, email) {
      fetch('/create-checkout-session', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer {{ api_token|default("") }}'
        },
        body: JSON.stringify({ tier, user_email: email })
      })
      .then(r => r.json())
      .then(data => {
        if (data.url) {
          window.location.href = data.url;
        } else {
          alert('Checkout error: ' + (data.error || 'Unavailable in local/dev'));
        }
      })
      .catch(err => alert('Network error: ' + err));
    }
  </script>
</head>
<body>
  <h1>SwiftSale Dashboard</h1>

  <p>Latest Bin Assignment: <span id="latest-bin">—</span></p>

  <!-- This button will only work on Render/cloud where Stripe is enabled -->
  <button onclick="initiateCheckout('Bronze', 'test@example.com')">Upgrade to Bronze</button>

 <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
 <script>
  const socket = io("/", {
    transports: ["polling"],
    upgrade: false
  });
</script>

</body>
</html>
